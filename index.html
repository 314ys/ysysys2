<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="강이륙 폰">
<title>강이륙 폰</title>
<style>
  :root{ --blue:#007aff; --red:#ff3b30; --green:#34c759; --sub:#8e8e93; --line:#d8d8dc; --bg:#f2f2f7; --card:#fff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;height:100%;background:#000;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#000}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hide{display:none!important}
  #phone{position:fixed;inset:0;overflow:hidden;background:#111;--hb:26px}

  /* PC처럼 넓은 화면에서는 아이폰 13 비율(390×844)의 액자로 표시 */
  @media (min-width:500px){
    html,body{display:flex;align-items:center;justify-content:center;background:#1a1a1f}
    #phone{position:relative;inset:auto;height:min(844px,calc(100vh - 40px));aspect-ratio:390/844;
      border-radius:47px;box-shadow:0 0 0 10px #000,0 0 0 12px #3a3a3f,0 24px 60px rgba(0,0,0,.5)}
  }

  /* ================= 잠금화면 ================= */
#lock,#home{
  position:absolute;
  inset:0;
  color:#fff;
}

#home{
  background-image:url("wallpaper.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
  #lock{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("lock.jpg") center/cover no-repeat}
  #lock{z-index:50;transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  #lock.gone{transform:translateY(-105%);pointer-events:none}
  .lk-lockicon{margin-top:calc(env(safe-area-inset-top) + 54px);opacity:.9}
  .lk-date{font-size:20px;font-weight:600;margin-top:10px;opacity:.92}
  .lk-time{font-size:88px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin-top:2px;
    text-shadow:0 2px 20px rgba(0,0,0,.15)}
  .lk-hint{margin-top:auto;margin-bottom:64px;font-size:16px;opacity:.85;animation:pulse 2.2s ease-in-out infinite}
  .lk-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.9}
  @keyframes pulse{50%{opacity:.35}}
  /* 비밀번호 키패드 */
  #pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top) + 100px);
    background:rgba(0,0,0,.3);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .25s;cursor:default}
  #pw.show{opacity:1;pointer-events:auto}
  #pw .pt{font-size:20px;font-weight:500}
  .dots{display:flex;gap:22px;margin:20px 0 70px}
  .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}
  .dots i.on{background:#fff}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
  .kp{display:grid;grid-template-columns:repeat(3,74px);gap:16px 22px}
  .kp button{width:74px;height:74px;border-radius:50%;border:.5px solid rgba(255,255,255,.28);color:#fff;
    background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;
    font-size:34px;font-weight:300;transition:background .15s}
  .kp button small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:3px;min-height:10px}
  .kp button:active{background:rgba(255,255,255,.5)}
  .pwfoot{width:calc(3*74px + 2*22px);display:flex;justify-content:space-between;margin-top:30px}
  .pwfoot button{background:none;border:0;color:#fff;font-size:17px;padding:8px 4px}
  .lk-date,.lk-time,.lk-lockicon{transition:opacity .25s}
  #lock.pwmode .lk-date,#lock.pwmode .lk-time,#lock.pwmode .lk-lockicon{opacity:0}
  #lock.pwmode .lk-hint{animation:none;opacity:0}

  /* ================= 홈화면 ================= */
  #home{z-index:1}
  .sb{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 26px 0;font-weight:600;font-size:16px;height:calc(env(safe-area-inset-top) + 38px)}
  .sb .time{cursor:pointer}

  .bat{...border:2.5px solid #fff;...background:#000;...}
  .bat::after{...background:#fff}
  .widget{margin:18px 22px 6px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .widget .wd{font-size:14px;opacity:.9}
  .widget .wt{font-size:40px;font-weight:700;letter-spacing:-1px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:20px 18px}
  .ico{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font-size:12px;padding:0}
  .ico .sq{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ico:active .sq{transform:scale(.92);filter:brightness(.9)}
  .ico svg{width:34px;height:34px}
  .ico span{text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .ico .sq{overflow:hidden}
  .ico .sq img{width:100%;height:100%;object-fit:cover;display:block}
  .ico.locked{pointer-events:none}
  .calico{width:100%;height:100%;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .calico b{font-size:11px;font-weight:600;color:#ff3b30;margin-bottom:2px}
  .calico span{font-size:30px;font-weight:300}

  /* 홈 위젯 */
  .wrow{display:flex;gap:14px;padding:16px 22px 0}
  .wcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .wlabel{font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .wrow .widget{margin:0;width:100%;aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:26px}
  .wct{width:100%;aspect-ratio:1;border:0;border-radius:26px;background:rgba(160,160,160,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .wct-av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:700;background:linear-gradient(#aebfe3,#7a82bb)}
  .wct-nm{font-size:16px;font-weight:600}
  .wcal{width:100%;aspect-ratio:1;border:0;border-radius:26px;background:#fff;color:#000;padding:12px 14px;text-align:left;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
  .wc-day{font-size:14px;font-weight:600}
  .wc-num{font-size:40px;font-weight:300;line-height:1.05}
  .wc-ev{margin-top:6px;display:flex;flex-direction:column;gap:5px;min-height:0}
  .wev{border-left:3px solid var(--c);background:#eef5fc;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:6px;padding:3px 7px;display:flex;flex-direction:column;overflow:hidden}
  .wev b{font-size:11px;font-weight:700;color:#1c1c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wev span{font-size:10.5px;color:var(--c)}
  .wnone{font-size:12px;color:#8e8e93}

  /* 홈 인디케이터 */
  #hb{position:absolute;bottom:0;left:0;right:0;height:var(--hb);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
  #hb i{display:block;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.9)}
  #hb.dark i{background:#000;opacity:.85}
  #hb.on{cursor:pointer}

  /* ================= 앱 공통 ================= */
  .app{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
    transform:scale(.3);opacity:0;pointer-events:none;border-radius:40px;
    transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s,border-radius .38s}
  .app.open{transform:scale(1);opacity:1;pointer-events:auto;border-radius:0}
  .appnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;min-height:56px;flex:none}
  .appnav .t{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appnav .nb{background:none;border:0;color:var(--blue);font-size:17px;padding:6px 2px;min-width:44px}
  .appnav .nb.r{text-align:right}.appnav .nb.l{text-align:left}
  .appnav .nb.danger{color:var(--red)}
  .appnav .nb:disabled{color:var(--sub)}
  .big{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:0 18px 10px}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--hb) + 10px)}
  .group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .row{display:flex;gap:12px;padding:11px 14px;align-items:center;position:relative;cursor:pointer}
  .row:active{background:rgba(120,120,128,.14)}
  .row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--line)}
  .av{width:44px;height:44px;border-radius:50%;flex:none;color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center}
  .row .b{flex:1;min-width:0}
  .row .n{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .p{color:var(--sub);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row .tm{color:var(--sub);font-size:14px;flex:none;align-self:flex-start;margin-top:2px}
  .empty{text-align:center;color:var(--sub);padding:90px 28px;line-height:1.7;font-size:16px}
  .plus{background:none;border:0;color:var(--blue);font-size:30px;line-height:1;padding:0 4px;min-width:44px;text-align:right}

  /* ================= 채팅 ================= */
  #app-chat{background:#fff}
  #chatList{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg)}
  #chatRoom{display:flex;flex-direction:column;flex:1;min-height:0}
  /* 채팅방 (아이메시지 스타일) */
  .rnav{display:flex;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;flex:none;background:#fff;border-bottom:.5px solid #ececef}
  .rbtn{width:46px;height:46px;border-radius:50%;border:.5px solid #e3e3e6;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08);display:grid;place-items:center;padding:0;color:#111}
  .rctr{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
  .rctr .av{width:58px;height:58px;font-size:24px}
  .rname{position:relative;z-index:1;margin-top:-14px;background:#fff;border:.5px solid #e3e3e6;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:4px 11px;font-weight:600;font-size:14px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rname::after{content:" ›";color:#aaa;font-weight:400}
  #cmsgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}
  .stamp{align-self:center;font-size:12px;color:#8e8e93;margin:14px 0 6px}
  .m{display:flex;max-width:78%}
  .m.me{align-self:flex-end}
  .m.them{align-self:flex-start}
  .m.last{margin-bottom:6px}
  .bub{position:relative;padding:9px 14px;border-radius:19px;font-size:16px;line-height:1.3;white-space:pre-wrap;word-break:break-word;background:#e9e9eb;color:#000}
  .me .bub{background:#3b8df5;color:#fff}
  .bub.tail::before,.bub.tail::after{content:"";position:absolute;bottom:0;height:18px}
  .me .bub.tail::before{right:-7px;width:20px;background:#3b8df5;border-bottom-left-radius:16px 14px}
  .me .bub.tail::after{right:-26px;width:26px;background:#fff;border-bottom-left-radius:10px}
  .them .bub.tail::before{left:-7px;width:20px;background:#e9e9eb;border-bottom-right-radius:16px 14px}
  .them .bub.tail::after{left:-26px;width:26px;background:#fff;border-bottom-right-radius:10px}
  .cbar{display:flex;gap:10px;align-items:center;padding:8px 14px calc(var(--hb) + 6px);background:#fff}
  .who{width:46px;height:46px;border-radius:50%;border:.5px solid #d6d6da;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08);font-size:13px;font-weight:600;flex:none;padding:0;color:#555}
  .who.me{color:#3b8df5}
  .cfield{flex:1;display:flex;align-items:center;gap:6px;height:46px;border:.5px solid #d6d6da;border-radius:23px;padding:0 6px 0 16px;box-shadow:0 1px 5px rgba(0,0,0,.06);min-width:0}
  .cfield input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px}
  .sendb{border:0;background:#3b8df5;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
  .sendb:disabled{opacity:0}

  /* ================= 유튜브 ================= */
  #app-youtube{background:#fff}
  #yList{display:flex;flex-direction:column;flex:1;min-height:0}
  #yPlayer{display:flex;flex-direction:column;flex:1;min-height:0}
  .ycard{margin:0 16px 18px;cursor:pointer;position:relative}
  .ycard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#ddd;display:block}
  .ycard b{display:block;margin-top:8px;font-size:15px;line-height:1.35;font-weight:600}
  .ycard .xdel{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
  #yFrameBox{width:100%;aspect-ratio:16/9;background:#000;flex:none}
  #yFrameBox iframe{width:100%;height:100%;border:0;display:block}
  #yTitle{padding:14px 16px;font-size:17px;font-weight:600;line-height:1.4}
  .ytbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 14px 10px 16px;flex:none}
  .ytlogo{display:flex;align-items:center;min-width:0}
  .ytlogo img{height:26px;display:none}
  .ytlogo b{font-size:23px;font-weight:700;letter-spacing:-.6px}
  .ytic{display:flex;align-items:center;gap:2px}
  .ytic button{position:relative;width:42px;height:42px;border:0;background:none;display:grid;place-items:center;color:#111;padding:0}
  .ytic i{position:absolute;top:1px;right:-1px;min-width:20px;height:20px;border-radius:10px;background:#d6283a;color:#fff;font:700 12px/20px sans-serif;text-align:center;padding:0 4px;box-sizing:border-box}
  .ytsearch{display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;flex:none}
  .ytsearch input{flex:1;min-width:0;height:40px;border:0;border-radius:20px;background:#f0f0f3;padding:0 16px;font-size:16px;outline:0}
  .ytsearch button{border:0;background:none;color:var(--blue);font-size:16px;padding:0}

  /* ================= 사파리 ================= */
  #app-safari{background:#f2f2f7;padding-top:calc(env(safe-area-inset-top) + 14px)}
  #sPage{flex:1;min-height:0;position:relative}
  #sHome,#sRes,#sSug{position:absolute;inset:0;overflow-y:auto;padding:14px 18px 20px}
  #sSug{background:#f2f2f7;z-index:3}
  .shead{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;margin:6px 0 14px}
  .sterms{background:#fff;border-radius:22px;overflow:hidden}
  .sterm{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:15px 18px;font-size:17px;text-align:left;color:#000;position:relative}
  .sterm+.sterm::before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--line)}
  .sterm svg{flex:none;color:#8e8e93}
  .sempty{padding:22px;color:var(--sub);text-align:center;font-size:15px}
  .spriv{display:flex;align-items:center;gap:20px;background:#fff;border-radius:26px;padding:22px}
  .spn{display:flex;align-items:center;gap:4px;font-size:32px;font-weight:500;flex:none}
  .spriv p{margin:0;font-size:15px;line-height:1.5;color:#111}
  .sqt{font-size:15px;color:var(--sub);margin:4px 2px 14px}
  .sres{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
  .sres small{color:#6b6b70;font-size:13px}
  .sres b{display:block;color:#1a0dab;font-size:18px;line-height:1.3;margin:3px 0;font-weight:500}
  .sres p{margin:0;color:#3c3c43;font-size:14.5px;line-height:1.5}
  .sgo{display:block;margin:16px auto 0;border:0;background:#fff;border-radius:20px;padding:10px 18px;font-size:15px;font-weight:600;color:#111}
  .sbar{display:flex;gap:10px;align-items:center;padding:8px 14px calc(var(--hb) + 6px);flex:none;background:#f2f2f7}
  .sc{width:52px;height:52px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);display:grid;place-items:center;color:#111;flex:none;padding:0}
  .sc:disabled{color:#c4c4c8}
  .spill{flex:1;min-width:0;height:52px;border-radius:26px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;gap:10px;padding:0 16px;color:#111}
  .spill input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
  .spill svg{flex:none}

  /* ================= 하단 독 / 음악 ================= */
  #dock{position:absolute;left:14px;right:14px;bottom:calc(var(--hb) + 10px);display:flex;justify-content:space-around;align-items:center;padding:14px 10px;border-radius:34px;background:rgba(255,255,255,.22);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  #dock .ico{position:relative}
  #dock .ico .sq{width:62px;height:62px;border-radius:15px}
  .bdg{position:absolute;top:-10px;right:-10px;min-width:30px;height:30px;padding:0 8px;box-sizing:border-box;border-radius:15px;background:#ee4a4a;color:#fff;font:600 17px/30px sans-serif;text-align:center;z-index:2}
  .hsearch{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--hb) + 122px);display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font-size:15px}

  /* ================= 피드 ================= */
  #app-feed{background:#fff}
  .post{border-bottom:.5px solid var(--line);padding-bottom:12px}
  .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
  .ph .av{width:34px;height:34px;font-size:14px}
  .ph .n{font-weight:600;font-size:15px;flex:1}
  .ph .del{border:0;background:none;color:var(--sub);font-size:13px}
  .post img.pi{width:100%;display:block;max-height:480px;object-fit:cover;background:#eee}
  .pa{display:flex;gap:14px;padding:10px 14px 2px}
  .pa button{background:none;border:0;padding:0;font-size:26px;line-height:1}
  .pa .liked{color:#ff2d55}
  .pt{padding:2px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .pd{padding:4px 14px 0;font-size:12px;color:var(--sub)}

  /* ================= 메모 ================= */
  #app-notes{background:#f2f2f7}
  .nview{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
  .nview svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nview svg.i3{fill:currentColor;stroke:none}
  .ntop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;flex:none}
  .cbtn{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#000;box-shadow:0 4px 16px rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  .cbtn.lg{width:56px;height:56px}
  .cbtn svg,.pillbtn svg,.tools svg{width:24px;height:24px}
  .ntitle{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}

    max = max||900; q = q||.72;

      const fr=new FileReader();
      fr.onload=()=>{ const img=new Image();
        img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
          c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
        img.onerror=rej; img.src=fr.result; };
      fr.onerror=rej; fr.readAsDataURL(file);
    });
  }

  const lastAt = r => r.msgs.length ? r.msgs[r.msgs.length-1].at : r.created;
  const stampOf = t => {
    const d=new Date(t), n=new Date(), WK=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
    const day0=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
    const diff=Math.round((day0(n)-day0(d))/86400000), h=d.getHours();
    const ap=(h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes());

    if(diff===1) return '어제 '+ap;
    if(diff>1 && diff<7) return WK[d.getDay()]+' '+h+':'+pad(d.getMinutes());
    return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+ap;
  };

  const dayDiff = t => { const sod=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); return Math.round((sod(new Date())-sod(new Date(t)))/86400000); };
  function noteDate(t){
    const d=new Date(t), df=dayDiff(t);
    if(df<=0){ const h=d.getHours(); return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes()); }

  let callCid=null;

  /* =====================================================
     캘린더 (2026년 10월 ~ 2027년 1월)
  ===================================================== */
  const CAL_MIN=[2026,9], CAL_MAX=[2027,0];                 // [연, 월(0부터)]
  let events = DB.get('events',[]);
  let calY=2026, calM=9, calSel='';
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const inRange = (y,m) => { const v=y*12+m; return v>=CAL_MIN[0]*12+CAL_MIN[1] && v<=CAL_MAX[0]*12+CAL_MAX[1]; };
  const allEvents = () => SEED_EVENTS.map(e=>Object.assign({seed:true,id:'seed-'+e.date+e.title},e)).concat(events);
  const evsOf = ds => allEvents().filter(e=>e.date===ds).sort((a,b)=>(a.time||'~').localeCompare(b.time||'~')||a.title.localeCompare(b.title,'ko'));
  const evColor = e => color(e.title);

  function calReset(){
    const now=new Date(); let y=now.getFullYear(), m=now.getMonth(), v=y*12+m;
    if(v<CAL_MIN[0]*12+CAL_MIN[1]){ y=CAL_MIN[0]; m=CAL_MIN[1]; } else if(v>CAL_MAX[0]*12+CAL_MAX[1]){ y=CAL_MAX[0]; m=CAL_MAX[1]; }
    calY=y; calM=m; calSel = (now.getFullYear()===y && now.getMonth()===m) ? ymd(now) : ymd(new Date(y,m,1));
  }
  function renderCal(){
    $('#calTitle').textContent = calY+'년 '+(calM+1)+'월';
    $('#calPrev').disabled = !inRange(calM===0?calY-1:calY, calM===0?11:calM-1);
    $('#calNext').disabled = !inRange(calM===11?calY+1:calY, calM===11?0:calM+1);
    const todayS=ymd(new Date()), start=new Date(calY,calM,1-new Date(calY,calM,1).getDay()), all=allEvents();
    let h='';
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), ds=ymd(d), out=d.getMonth()!==calM;
      const dots = out ? '' : all.filter(e=>e.date===ds).slice(0,3).map(e=>'<i style="--c:'+evColor(e)+'"></i>').join('');
      h+='<button class="cc'+(out?' out':'')+(ds===todayS?' today':'')+(ds===calSel?' sel':'')+(d.getDay()===0?' sun':'')+'" data-d="'+ds+'"'+(out?' disabled':'')+
         '><span class="n">'+d.getDate()+'</span><span class="cdots">'+dots+'</span></button>';
    }
    $('#calGrid').innerHTML=h; renderDay();
  }
  function renderDay(){

    $('#calEvs').innerHTML = evs.length ? evs.map(e=>
      '<div class="cev" style="--c:'+evColor(e)+'"><div class="t"><b>'+esc(e.title)+'</b>'+(e.time?'<span>'+esc(e.time)+'</span>':'')+'</div>'+
      (e.seed ? '<span class="tag">공용</span>' : '<button data-del="'+e.id+'">삭제</button>')+'</div>').join('') : '<div class="cnone">일정이 없어요</div>';
  }
  function calGo(step){
    let y=calY, m=calM+step; if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    if(!inRange(y,m)) return;
    calY=y; calM=m; const now=new Date();
    calSel = (now.getFullYear()===y && now.getMonth()===m) ? ymd(now) : ymd(new Date(y,m,1));
    renderCal();
  }

  /* 홈 화면 캘린더 위젯 + 앱 아이콘의 날짜 */
  function refreshCal(){
    const now=new Date(), evs=evsOf(ymd(now));
    $('#wcDay').textContent=DAYS[now.getDay()]+'요일';
    $('#wcNum').textContent=now.getDate();
    $('#wcEv').innerHTML = !evs.length ? '<div class="wnone">일정 없음</div>' :
      evs.slice(0,2).map(e=>'<div class="wev" style="--c:'+evColor(e)+'"><b>'+esc(e.title)+'</b>'+(e.time?'<span>'+esc(e.time)+'</span>':'')+'</div>').join('')+
      (evs.length>2 ? '<div class="wnone">+'+(evs.length-2)+'개 더</div>' : '');
    const ci=document.querySelector('.calico'); if(ci) ci.innerHTML='<b>'+DAYS[now.getDay()]+'</b><span>'+now.getDate()+'</span>';
  }
  $('#wCal').addEventListener('click', ()=>{
    const r=$('#wCal').getBoundingClientRect(), pr=$('#phone').getBoundingClientRect();
    $('#app-calendar').style.transformOrigin=((r.left+r.width/2-pr.left)/pr.width*100)+'% '+((r.top+r.height/2-pr.top)/pr.height*100)+'%';
    openApp('calendar');
  });
  refreshCal(); setInterval(refreshCal,30000);

  /* 홈 화면 연락처 위젯 */
  const CW = {name:'송화누나', abbr:'송화'};     // ← 위젯에 띄울 연락처 이름 / 동그라미 안 글자
  $('#wctAv').textContent = CW.abbr; $('#wctNm').textContent = CW.name;
  $('#wContact').addEventListener('click', ()=>{
    const r=$('#wContact').getBoundingClientRect(), pr=$('#phone').getBoundingClientRect();
    $('#app-phone').style.transformOrigin=((r.left+r.width/2-pr.left)/pr.width*100)+'% '+((r.top+r.height/2-pr.top)/pr.height*100)+'%';
    openApp('phone');
    const c=contacts.find(x=>x.name===CW.name);
    if(c && callWho===null) startCall(c.num, c.id);
  });

  /* =====================================================
     유튜브
  ===================================================== */
  // 모두에게 보일 영상. id = 유튜브 주소의 영상 ID(11글자). 예: {id:'dQw4w9WgXcQ', title:'제목'},
  const SEED_VIDEOS = [

{id:'aJy3yxiM2hU', title:'감독은 천재인가.. 역대급 반전영화 [영화리뷰/결말포함]'},
{id:'eeY78BD545I', title:'🔥평점 9.7🔥 "로맨스 영화의 정점" 이거 아직도 안 본 사람 있나요?'},
{id:'VcBBvkC_OIc', title:'전기뱀장어(ElectricEels) - 미로(Maze)'},

  ];
  let videos = DB.get('videos',[]), ytQ = '';
  const ytId = u => { u=String(u).trim(); const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : null); };
  function renderYt(){
    const all = SEED_VIDEOS.map(v=>Object.assign({seed:true},v)).concat(videos).filter(v=>!ytQ || (v.title||'').toLowerCase().includes(ytQ));
    $('#yRows').innerHTML = all.length ? all.map(v=>
      '<div class="ycard" data-id="'+v.id+'"><img loading="lazy" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg" alt=""><b>'+esc(v.title||'영상')+'</b>'+
      (v.seed?'':'<button class="xdel" data-del="'+v.uid+'">✕</button>')+'</div>').join('')
      : '<div class="empty">'+(ytQ?'검색 결과가 없어요':'영상이 없어요<br>오른쪽 위 ＋ 로 유튜브 링크를 추가해보세요')+'</div>';
  }
  function ytPlay(id,title){
    $('#yList').classList.add('hide'); $('#yPlayer').classList.remove('hide');
    $('#yFrameBox').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    $('#yTitle').textContent=title;
  }
  function ytStop(){ $('#yFrameBox').innerHTML=''; $('#yPlayer').classList.add('hide'); $('#yList').classList.remove('hide'); }
  R.youtube = function(){ ytStop(); ytQ=''; $('#ytQ').value=''; $('#ytSearch').classList.add('hide'); $('#ytBar').classList.remove('hide'); renderYt(); };
  $('#yRows').addEventListener('click', e=>{
    const d=e.target.closest('[data-del]');
    if(d){ if(confirm('이 영상을 목록에서 지울까요?')){ videos=videos.filter(v=>v.uid!==d.dataset.del); DB.set('videos',videos); renderYt(); } return; }
    const c=e.target.closest('.ycard'); if(c) ytPlay(c.dataset.id, c.querySelector('b').textContent);
  });
  $('#yBack').addEventListener('click', ytStop);
  $('#yAdd').addEventListener('click', ()=>openSheet({title:'영상 추가', saveLabel:'추가',
    fields:[{key:'title',ph:'제목 (선택)',max:60},{key:'url',ph:'유튜브 링크 붙여넣기',req:true,max:200}],
    onSave:v=>{ const id=ytId(v.url); if(!id){ toast('유튜브 링크가 아니에요'); return; }
      videos.unshift({uid:uid(),id,title:(v.title||'').trim()||'영상'}); DB.set('videos',videos); renderYt(); }}));

  /* 유튜브 상단바 */
  const YT_BADGE = 9;     // 종 모양 옆 빨간 숫자 (0 이면 안 보여요)
  (function(){
    const im=$('#ytLogoImg'), show=()=>{ im.style.display='block'; $('#ytLogoTx').style.display='none'; };
    im.addEventListener('load', show); if(im.complete && im.naturalWidth) show();
    const bd=$('#ytBadge'); bd.textContent=YT_BADGE; bd.style.display=YT_BADGE?'block':'none';
  })();
  $('#ytBell').addEventListener('click', ()=>toast('새 알림이 없어요'));
  $('#ytSearchBtn').addEventListener('click', ()=>{ $('#ytBar').classList.add('hide'); $('#ytSearch').classList.remove('hide'); $('#ytQ').focus(); });
  $('#ytQx').addEventListener('click', ()=>{ ytQ=''; $('#ytQ').value=''; $('#ytSearch').classList.add('hide'); $('#ytBar').classList.remove('hide'); renderYt(); });
  $('#ytQ').addEventListener('input', e=>{ ytQ=e.target.value.trim().toLowerCase(); renderYt(); });

  /* =====================================================
     사파리 (검색 전용)
  ===================================================== */
  // ▼ 미리 등록할 검색어. results 는 선택사항이에요(없으면 "등록된 결과가 없어요"가 나와요)
  //   results 항목: {site:'사이트이름', title:'제목', desc:'설명', url:'눌렀을 때 열 주소(없으면 빈칸)'}
  const SEED_SEARCHES = [

    {q:'카페추천', results:[
      {site:'블로그', title:'분위기 좋은 카페 BEST 10 - 네이버 블로그', desc:'2022.5.19 ― 1. 천상가옥 영업시간 매일 11:00 ~ 22:00. 유료주차, 반려동물 동반 가능 · 2. 구욱희씨 · 3. 까사부사노 · 4. 세세커피', url:''},
      {site:'Trip.com', title:'2026 카페 추천 Best 7', desc:'2025.12.22 ― 목록. 카페 추천 7곳 모음; #1 잼잼; #2 매일카페 #3 담금', url:''}
    ]},

    {q:'라라랜드 예매', locked:true},
    {q:'라라랜드 재개봉', locked:true},

    {q:'점심 메뉴 룰렛', results:[
      {site:'lunch-roulette1.com', title:'오늘 뭐 먹지? 점심 메뉴 룰렛', desc:'오늘 뭐 먹지? . 원하는 카테고리를 모두 선택하고 “결과 보기”를 눌러주세요! #한식 #중식 #일식 #양식 #분식 #패스트푸드 #아무거나. 결과 보기 룰렛!', url:'https://www.lunch-roulette1.com'},
    ]},

    {q:'여자친구 짜증', results:[
      {site:'Blind', title:'여친의 짜증 어떻게 할까.. - 썸·연애', desc:'2022. 3. 12. — 그냥 잘 안맞는거 같은데.. 형이 너무 편한가봐요. 가깝고 편할수록 존중하고 매너있게 대화를 해야하는데, 너무 편하니까 막대하는 것 같이 보여요.', url:''},
      {site:'Reddit r/self', title:'여자친구가 계속 나한테 짜증을 내 : r/self', desc:'당장 헤어지라는 건 아니지만, 관계에서 스스로가 가치 없다고 느껴지거나 기분이 안 좋다면, 그녀보다 너 자신의 자율성을 먼저 생각해 봐. 그녀와 상의 ...', url:''}
    ]},

    {q:'깨워달라고 하고 짜증', locked:true},
  ];
  const PRIVACY_COUNT = 70;   // 개인정보 보호 리포트 숫자
  const MAG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
  let sQuery = '';
  $('#sPrivN').textContent = PRIVACY_COUNT; $('#sPrivT').textContent = PRIVACY_COUNT;
  const gUrl = q => 'https://www.google.com/search?q='+encodeURIComponent(q);
  const LOCK = '<svg class="lk" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';
  const termBtn = (s,i) => '<button class="sterm" data-i="'+i+'">'+MAG+'<span>'+esc(s.q)+'</span></button>';
  function renderTerms(){
    $('#sTerms').innerHTML = SEED_SEARCHES.length ? SEED_SEARCHES.map((s,i)=>termBtn(s,i)).join('') : '<div class="sempty">등록된 검색어가 없어요</div>';
  }
  function sSuggest(){
    const raw=$('#sQ').value.trim(), q=raw.toLowerCase();
    const list=SEED_SEARCHES.map((s,i)=>({s,i})).filter(o=>!q || o.s.q.toLowerCase().includes(q));
    $('#sSug').innerHTML = '<div class="sterms">'+list.map(o=>termBtn(o.s,o.i)).join('')+
      (raw ? '<button class="sterm" data-free="1">'+MAG+'<span>“'+esc(raw)+'” 검색</span></button>' : '')+'</div>';
    $('#sSug').classList.remove('hide');
  }
  function sHomeShow(){
    sQuery=''; $('#sRes').classList.add('hide'); $('#sSug').classList.add('hide'); $('#sHome').classList.remove('hide');
    $('#sQ').value=''; $('#sBack').disabled=true;
  }
  function sSearch(text, idx){
    const raw=String(text).trim(); if(!raw) return;
    const reg = idx!=null ? SEED_SEARCHES[idx] : SEED_SEARCHES.find(s=>s.q.toLowerCase()===raw.toLowerCase());
    if(reg && reg.locked) return;
    $('#sQ').blur(); $('#sSug').classList.add('hide');
    if(!reg){ $('#sQ').value=raw; window.open(gUrl(raw),'_blank','noopener'); toast('새 탭에서 검색했어요'); return; }
    sQuery=reg.q; $('#sQ').value=reg.q;
    const rs=reg.results||[];
    $('#sRes').innerHTML = '<div class="sqt">“'+esc(reg.q)+'” 검색 결과</div>'+
      (rs.length ? rs.map(r=>'<div class="sres" data-u="'+esc(r.url||'')+'"><small>'+esc(r.site||'')+'</small><b>'+esc(r.title||'')+'</b><p>'+esc(r.desc||'')+'</p></div>').join('') : '<div class="sempty">등록된 결과가 없어요</div>')+
      '<button class="sgo" data-g="1">Google에서 더 검색하기</button>';
    $('#sHome').classList.add('hide'); $('#sRes').classList.remove('hide'); $('#sRes').scrollTop=0; $('#sBack').disabled=false;
  }
  R.safari = function(){ renderTerms(); };
  $('#sTerms').addEventListener('click', e=>{ const b=e.target.closest('.sterm'); if(b) sSearch(SEED_SEARCHES[+b.dataset.i].q, +b.dataset.i); });
  $('#sSug').addEventListener('pointerdown', e=>e.preventDefault());
  $('#sSug').addEventListener('click', e=>{ const b=e.target.closest('.sterm'); if(!b) return;
    if(b.dataset.free) sSearch($('#sQ').value); else sSearch(SEED_SEARCHES[+b.dataset.i].q, +b.dataset.i); });
  $('#sRes').addEventListener('click', e=>{
    if(e.target.closest('[data-g]')){ window.open(gUrl(sQuery),'_blank','noopener'); return; }
    const r=e.target.closest('.sres'); if(r && r.dataset.u) window.open(r.dataset.u,'_blank','noopener');
  });
  $('#sQ').addEventListener('focus', sSuggest);
  $('#sQ').addEventListener('input', sSuggest);
  $('#sQ').addEventListener('blur', ()=>setTimeout(()=>$('#sSug').classList.add('hide'),200));
  $('#sQ').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); sSearch(e.target.value); } });
  $('#sBack').addEventListener('click', sHomeShow);
  $('#sMore').addEventListener('click', ()=>{ if(sQuery) window.open(gUrl(sQuery),'_blank','noopener'); else toast('열려 있는 검색 결과가 없어요'); });
  $('#sMic').addEventListener('click', ()=>toast('음성 입력은 지원되지 않아요'));

})();
</script>
</body>
</html>
